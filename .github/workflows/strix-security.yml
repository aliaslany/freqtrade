name: Strix Security Scan

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read
  security-events: write

jobs:
  strix:
    name: AI penetration test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Strix
        run: curl -sSL https://strix.ai/install | bash

      - name: Run Strix
        env:
          STRIX_LLM: ${{ secrets.STRIX_LLM }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          strix -n \
            -t ./ \
            --scan-mode quick \
            --scope-mode diff \
            --diff-base "origin/${{ github.base_ref }}" \
            --max-budget 10

      - name: Prepare Strix SARIF
        if: always()
        run: |
          sarif=$(find strix_runs -name findings.sarif -type f -print -quit 2>/dev/null || true)
          if [ -n "$sarif" ]; then
            cp "$sarif" strix-results.sarif
          fi

      - name: Upload Strix SARIF
        if: always() && hashFiles('strix-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: strix-results.sarif
          category: strix
